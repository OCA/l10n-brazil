[checklog-odoo]
ignore=
    WARNING.* 0 failed, 0 error\(s\).*
    WARNING .* Killing chrome descendants-or-self .*
    WARNING.* Missing widget: res_partner_many2one for field of type many2one.*
    WARNING.*Unparseable assessment timestamp
    WARNING.*The CBS assessment callback URL .* is not HTTPS
    WARNING.*Skipping assessment group with unexpected period
    WARNING.*The tax administration refused request
    WARNING.*CBS assessment callback for unknown ticket
    WARNING.*CBS assessment callback reached with an unknown token
    ERROR.*CBS assessment status poll failed for request
