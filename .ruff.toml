
target-version = "py310"
fix = true

[lint]
extend-select = [
    "B",
    "C90",
    "E501",  # line too long (default 88)
    "I",  # isort
    "UP",  # pyupgrade
]
# Ruff >= 0.15 enables those by default, but they do not apply to the Odoo
# idioms used in this repo (same exceptions as in Odoo's own ruff.toml):
# `RUF012` flags the ubiquitous `_inherit = ["model", "mixin"]` and class
# level selection constants, `SIM102`/`SIM117` flag the nested `if`/`with`
# style used all over the framework.
ignore = [
    "RUF012",  # mutable-class-default
    "SIM102",  # collapsible-if
    "SIM117",  # multiple-with-statements
]
extend-safe-fixes = ["UP008"]
exclude = ["setup/*"]

[format]
exclude = ["setup/*"]

[lint.per-file-ignores]
"__init__.py" = ["F401", "I001"]  # ignore unused and unsorted imports in __init__.py
"__manifest__.py" = ["B018"]  # useless expression

[lint.isort]
section-order = ["future", "standard-library", "third-party", "odoo", "odoo-addons", "first-party", "local-folder"]

[lint.isort.sections]
"odoo" = ["odoo"]
"odoo-addons" = ["odoo.addons"]

[lint.mccabe]
max-complexity = 16
